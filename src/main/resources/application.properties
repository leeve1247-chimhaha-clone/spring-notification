spring.application.name=spring-notification

# DB (overridden by env in docker-compose)
spring.datasource.url=jdbc:mysql://mysql-notification-container:3306/notification_database
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka
spring.kafka.bootstrap-servers=kafka-container:9092
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=chimhaha-notification
spring.kafka.consumer.auto-offset-reset=earliest

# Keycloak JWT (shared with spring/)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak-container:8080/realms/clone/protocol/openid-connect/certs

# Server
server.port=8080
